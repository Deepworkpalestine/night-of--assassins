name: Build Night Of Assassins APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract game project
        run: |
          mkdir app
          unzip -q night-of-assassins-github-upload.zip -d app

      - name: Build APK
        working-directory: app
        run: |
          flutter create --platforms=android --project-name night_of_assassins .
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Of-Assassins-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
