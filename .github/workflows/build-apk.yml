name: Build Night Of Assassins APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract game project
        run: |
          mkdir app
          unzip -q night-of-assassins-github-upload.zip -d app

      - name: Fix Arabic strings
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/screens/learn_screen.dart")
          s = p.read_text(encoding="utf-8")

          start = s.index("          const Text(\n            '•")
          end = s.index("            style: TextStyle(color: Colors.white70", start)

          replacement = """          const Text(
            '• المواطنون الصالحون: يفوزون عند طرد جميع أعضاء المافيا.\\n'
            '• فريق المافيا (المغتالون): يفوزون إذا تساوى عددهم مع عدد بقية اللاعبين الأحياء.\\n'
            '• الأدوار المستقلة (المهرج والمراهن): يلعبون لمصلحتهم الشخصية ولهم شروط فوز مستقلة.',
"""
          p.write_text(s[:start] + replacement + s[end:], encoding="utf-8")
          PY

      - name: Build APK
        working-directory: app
        run: |
          flutter create --platforms=android --project-name night_of_assassins .
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Of-Assassins-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
