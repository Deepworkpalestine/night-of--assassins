
name: Build Night Of Assassins APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          mkdir -p app
          unzip -o -q night-of-assassins-github-upload.zip -d app

      - name: Generate Android platform
        working-directory: app
        run: |
          flutter create --platforms=android --project-name night_of_assassins .

      - name: Repair Arabic learning screen
        working-directory: app
        run: |
          cat > lib/screens/learn_screen.dart <<'DART'
          import 'package:flutter/material.dart';
          import '../models/mafia_role.dart';
          import '../widgets/gothic_background.dart';

          class LearnScreen extends StatelessWidget {
            const LearnScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return GothicBackground(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  centerTitle: true,
                  title: const Text('شرح اللعبة والأدوار'),
                ),
                child: ListView(
                  padding: const EdgeInsets.all(18),
                  children: [
                    const Text(
                      'فِرَق اللعبة وشروط الفوز',
                      style: TextStyle(
                        fontSize: 20,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 8),
                    const Text(
                      '• المواطنون الصالحون: يفوزون عند طرد جميع أعضاء المافيا.\n'
                      '• فريق المافيا (المغتالون): يفوزون إذا تساوى عددهم مع عدد بقية اللاعبين الأحياء.\n'
                      '• الأدوار المستقلة (المهرج والمراهن): يلعبون لمصلحتهم الشخصية ولهم شروط فوز مستقلة.',
                      style: TextStyle(
                        color: Colors.white70,
                        height: 1.5,
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text(
                      'جميع الأدوار في ليلة المغتالين',
                      style: TextStyle(
                        fontSize: 20,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 10),
                    ...MafiaRoleInfo.roles.values.map((info) {
                      return Card(
                        color: const Color(0xFF22090E),
                        margin: const EdgeInsets.only(bottom: 12),
                        child: ListTile(
                          leading: CircleAvatar(
                            backgroundColor: info.color.withOpacity(0.2),
                            child: Icon(
                              info.icon,
                              color: info.color,
                            ),
                          ),
                          title: Text(
                            info.nameAr,
                            style: TextStyle(
                              fontWeight: FontWeight.bold,
                              color: info.color,
                            ),
                          ),
                          subtitle: Padding(
                            padding: const EdgeInsets.only(top: 6),
                            child: Text(info.fullDesc),
                          ),
                        ),
                      );
                    }),
                  ],
                ),
              );
            }
          }
          DART

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: app
        run: dart format lib

      - name: Build Release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Of-Assassins-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
